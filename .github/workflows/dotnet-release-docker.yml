name: .NET Docker Release

on:
  workflow_call:
    inputs:
      image-name:
        description: Full GHCR image name (e.g. ghcr.io/st0o0/njord)
        type: string
        required: true
      image-description:
        description: OCI image description annotation
        type: string
        default: ''
      solution-path:
        description: Path to the solution directory
        type: string
        default: 'src'
      solution-file:
        description: Solution file name for tests
        type: string
        required: true
      publish-project:
        description: Project path for dotnet publish (relative to solution-path)
        type: string
        required: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - rid: linux-x64
            platform: linux/amd64
            test: true
          - rid: linux-arm64
            platform: linux/arm64
            test: false
          - rid: linux-arm
            platform: linux/arm/v7
            test: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish
        working-directory: ${{ inputs.solution-path }}
        run: >-
          dotnet publish ${{ inputs.publish-project }}
          -c Release -r ${{ matrix.rid }} --self-contained false
          -o ../publish/${{ matrix.rid }}
          -p:Version=${{ needs.release-please.outputs.version }}
      - if: matrix.test
        name: Test
        working-directory: ${{ inputs.solution-path }}
        run: dotnet test ${{ inputs.solution-file }}
      - uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 1

  docker:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: publish
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            type=raw,value=latest

      - name: Build and push amd64
        uses: docker/build-push-action@v7
        id: build-amd64
        with:
          file: Dockerfile
          context: publish/publish-linux-x64
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          provenance: true
          sbom: true
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push arm64
        uses: docker/build-push-action@v7
        id: build-arm64
        with:
          file: Dockerfile
          context: publish/publish-linux-arm64
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          provenance: true
          sbom: true
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push armv7
        uses: docker/build-push-action@v7
        id: build-armv7
        with:
          file: Dockerfile
          context: publish/publish-linux-arm
          platforms: linux/arm/v7
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=armv7
          cache-to: type=gha,scope=armv7,mode=max
          provenance: true
          sbom: true
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Create multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          AMD64: ${{ steps.build-amd64.outputs.digest }}
          ARM64: ${{ steps.build-arm64.outputs.digest }}
          ARMV7: ${{ steps.build-armv7.outputs.digest }}
          IMAGE: ${{ inputs.image-name }}
          DESC: ${{ inputs.image-description }}
        run: |
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "$TAGS"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DESC}" \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            $TAG_ARGS \
            "${IMAGE}@${AMD64}" \
            "${IMAGE}@${ARM64}" \
            "${IMAGE}@${ARMV7}"

      - name: Get manifest digest
        id: manifest
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          IMAGE: ${{ inputs.image-name }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Sign the published image (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE: ${{ inputs.image-name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
