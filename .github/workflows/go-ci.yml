name: Go CI

on:
  workflow_call:
    inputs:
      golangci-lint-version:
        description: golangci-lint version
        type: string
        default: 'v2.12'
      has-e2e:
        description: Run e2e tests (expects tests/e2e/run.sh)
        type: boolean
        default: false
      has-dockerfile:
        description: Build and lint Dockerfile
        type: boolean
        default: true
      smoke-test-script:
        description: Path to smoke test script (empty to skip)
        type: string
        default: ''
      docker-image-name:
        description: Image name for Docker build (without registry)
        type: string
        default: 'app'

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
      - if: inputs.has-dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  build:
    if: inputs.has-dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ inputs.docker-image-name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: inputs.smoke-test-script != ''
        name: Smoke test
        run: |
          chmod +x ${{ inputs.smoke-test-script }}
          ${{ inputs.smoke-test-script }}

  e2e:
    if: inputs.has-e2e
    needs: [unit, lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ inputs.docker-image-name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          chmod +x tests/e2e/run.sh
          ./tests/e2e/run.sh
