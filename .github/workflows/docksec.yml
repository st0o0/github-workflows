name: DockSec

on:
  workflow_call:
    inputs:
      scan-type:
        description: "'dockerfile', 'compose', or 'fs' (filesystem/dependency scan)"
        type: string
        default: 'dockerfile'
      target:
        description: "Path to Dockerfile, compose file, or scan directory (default: Dockerfile for dockerfile, . for fs)"
        type: string
        default: ''
      severity:
        description: Comma-separated severity levels
        type: string
        default: 'CRITICAL,HIGH'
      fail-on:
        description: "Fail if findings at or above this level (CRITICAL, HIGH, MEDIUM, LOW, empty = no blocking)"
        type: string
        default: ''
      trivy-config:
        description: >-
          Path to trivy.yaml for fs scan tuning (skip-files, skip-dirs, etc.).
          Only used when scan-type is fs.
        type: string
        default: ''

jobs:
  docksec-dockerfile:
    if: inputs.scan-type == 'dockerfile'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run DockSec
        uses: OWASP/DockSec@v2026.9.21
        with:
          dockerfile: ${{ inputs.target || 'Dockerfile' }}
          scan_only: 'true'
          severity: ${{ inputs.severity }}
          fail_on: ${{ inputs.fail-on }}
          sarif: 'true'
          output_dir: ${{ github.workspace }}/docksec-results

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('docksec-results/**/*.sarif') != ''
        with:
          sarif_file: docksec-results
          category: docksec-dockerfile

  docksec-compose:
    if: inputs.scan-type == 'compose'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run DockSec
        uses: OWASP/DockSec@v2026.9.21
        with:
          compose: ${{ inputs.target }}
          scan_only: 'true'
          severity: ${{ inputs.severity }}
          fail_on: ${{ inputs.fail-on }}
          sarif: 'true'
          output_dir: ${{ github.workspace }}/docksec-results

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('docksec-results/**/*.sarif') != ''
        with:
          sarif_file: docksec-results
          category: docksec-compose

  trivy-fs:
    if: inputs.scan-type == 'fs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.target || '.' }}
          trivy-config: ${{ inputs.trivy-config }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: ${{ inputs.fail-on != '' && '1' || '0' }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: docksec-fs
