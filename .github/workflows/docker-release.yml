name: Docker Release

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version to publish (e.g. 0.2.0)
        type: string
        required: true
      image-name:
        description: Full GHCR image name (e.g. ghcr.io/st0o0/app)
        type: string
        required: true
      image-description:
        description: OCI image description annotation
        type: string
        default: ''
      platforms:
        description: 'Comma-separated platforms (e.g. linux/amd64,linux/arm64,linux/arm/v7)'
        type: string
        default: 'linux/amd64,linux/arm64'
      build-contexts:
        description: |
          Additional named build contexts passed to docker build (one per line).
          Format: name=artifact-name
          The artifact name matches the directory created by download-artifact.
          In the Dockerfile, use COPY --from=name to reference them.
          Example: ui=ui-dist
        type: string
        default: ''
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: 'Dockerfile'

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ inputs.dockerfile }}
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version components
        id: semver
        run: |
          echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ steps.semver.outputs.minor }}
            type=raw,value=latest

      - name: Build and push amd64
        if: contains(format(',{0},', inputs.platforms), ',linux/amd64,')
        uses: docker/build-push-action@v7
        id: build-amd64
        with:
          file: ${{ inputs.dockerfile }}
          context: publish-linux-x64
          build-contexts: ${{ inputs.build-contexts }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          provenance: true
          sbom: true
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push arm64
        if: contains(format(',{0},', inputs.platforms), ',linux/arm64,')
        uses: docker/build-push-action@v7
        id: build-arm64
        with:
          file: ${{ inputs.dockerfile }}
          context: publish-linux-arm64
          build-contexts: ${{ inputs.build-contexts }}
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          provenance: true
          sbom: true
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push armv7
        if: contains(format(',{0},', inputs.platforms), ',linux/arm/v7,')
        uses: docker/build-push-action@v7
        id: build-armv7
        with:
          file: ${{ inputs.dockerfile }}
          context: publish-linux-arm
          build-contexts: ${{ inputs.build-contexts }}
          platforms: linux/arm/v7
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=armv7
          cache-to: type=gha,scope=armv7,mode=max
          provenance: true
          sbom: true
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Collect digests
        id: digests
        run: |
          DIGESTS=""
          for digest in \
            "${{ steps.build-amd64.outputs.digest }}" \
            "${{ steps.build-arm64.outputs.digest }}" \
            "${{ steps.build-armv7.outputs.digest }}"; do
            [ -n "$digest" ] && DIGESTS="$DIGESTS ${{ inputs.image-name }}@${digest}"
          done
          echo "all=$DIGESTS" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGESTS: ${{ steps.digests.outputs.all }}
          DESC: ${{ inputs.image-description }}
        run: |
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "$TAGS"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DESC}" \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            $TAG_ARGS \
            $DIGESTS

      - name: Get manifest digest
        id: manifest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ inputs.image-name }}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the published image (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${{ inputs.image-name }}@${DIGEST}"
