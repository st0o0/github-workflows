name: Docker Release

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version to publish (e.g. 0.2.0)
        type: string
        required: true
      image-name:
        description: Full GHCR image name (e.g. ghcr.io/st0o0/app)
        type: string
        required: true
      image-description:
        description: OCI image description annotation
        type: string
        default: ''
      platforms:
        description: 'Comma-separated platforms (e.g. linux/amd64,linux/arm64,linux/arm/v7)'
        type: string
        default: 'linux/amd64,linux/arm64'
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: 'Dockerfile'

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version components
        id: semver
        run: |
          echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ steps.semver.outputs.minor }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.dockerfile }}
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.description=${{ inputs.image-description }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Get manifest digest
        id: manifest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ inputs.image-name }}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the published image (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${{ inputs.image-name }}@${DIGEST}"
