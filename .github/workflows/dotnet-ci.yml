name: .NET CI

on:
  workflow_call:
    inputs:
      solution-path:
        description: Path to the solution directory
        type: string
        default: 'src'
      solution-file:
        description: Solution file name (sln/slnx)
        type: string
        required: true
      has-dockerfile:
        description: Lint Dockerfile with hadolint
        type: boolean
        default: true
      check-format:
        description: Run dotnet format whitespace check
        type: boolean
        default: true
      locked-mode:
        description: Use --locked-mode for restore (requires packages.lock.json)
        type: boolean
        default: true
      slopwatch:
        description: Run Slopwatch analysis to detect LLM reward-hacking patterns (requires .config/dotnet-tools.json with Slopwatch.Cmd)
        type: boolean
        default: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
      - name: CI setup hook
        uses: ./.github/actions/ci-setup
        if: hashFiles('.github/actions/ci-setup/action.yml') != ''
      - name: Restore
        working-directory: ${{ inputs.solution-path }}
        run: dotnet restore ${{ inputs.solution-file }} ${{ inputs.locked-mode && '--locked-mode' || '' }}
      - name: Build
        working-directory: ${{ inputs.solution-path }}
        run: dotnet build ${{ inputs.solution-file }} --no-restore /p:ContinuousIntegrationBuild=true
      - name: CI post-build hook
        uses: ./.github/actions/ci-post-build
        if: hashFiles('.github/actions/ci-post-build/action.yml') != ''
      - name: Test
        working-directory: ${{ inputs.solution-path }}
        run: >-
          dotnet test --solution ${{ inputs.solution-file }} --no-build --no-ansi
          --coverage --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/testresults
      - uses: danielpalme/ReportGenerator-GitHub-Action@70c37c4d588cff5bf9cf190830c6f01dfcfb884b # v5
        if: always()
        with:
          reports: '${{ github.workspace }}/testresults/**/*.cobertura.xml'
          targetdir: ./coveragereport
          reporttypes: MarkdownSummaryGithub
      - if: always()
        run: cat ./coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
      - if: inputs.has-dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - if: inputs.check-format
        name: Restore
        working-directory: ${{ inputs.solution-path }}
        run: dotnet restore ${{ inputs.solution-file }} ${{ inputs.locked-mode && '--locked-mode' || '' }}
      - if: inputs.check-format
        working-directory: ${{ inputs.solution-path }}
        run: dotnet format ${{ inputs.solution-file }} whitespace --no-restore --verify-no-changes
      - if: inputs.slopwatch
        name: Restore tools
        run: dotnet tool restore
      - if: inputs.slopwatch
        name: Slopwatch
        run: dotnet slopwatch analyze -d . --fail-on error
