name: .NET CI

on:
  workflow_call:
    inputs:
      solution-path:
        description: Path to the solution directory
        type: string
        default: 'src'
      solution-file:
        description: Solution file name (sln/slnx)
        type: string
        required: true
      has-dockerfile:
        description: Lint Dockerfile with hadolint
        type: boolean
        default: true
      check-format:
        description: Run dotnet format whitespace check
        type: boolean
        default: true
      locked-mode:
        description: Use --locked-mode for restore (requires packages.lock.json)
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        working-directory: ${{ inputs.solution-path }}
        run: dotnet restore ${{ inputs.solution-file }} ${{ inputs.locked-mode && '--locked-mode' || '' }}
      - name: Build
        working-directory: ${{ inputs.solution-path }}
        run: dotnet build ${{ inputs.solution-file }} --no-restore
      - name: Test
        working-directory: ${{ inputs.solution-path }}
        run: >-
          dotnet test --solution ${{ inputs.solution-file }} --no-build
          --coverage --coverage-output-format cobertura
          --coverage-output ${{ github.workspace }}/testresults/coverage.cobertura.xml
          --results-directory ${{ github.workspace }}/testresults
      - uses: danielpalme/ReportGenerator-GitHub-Action@5
        if: always()
        with:
          reports: '${{ github.workspace }}/testresults/**/coverage.cobertura.xml'
          targetdir: ./coveragereport
          reporttypes: MarkdownSummaryGithub
      - if: always()
        run: cat ./coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - if: inputs.has-dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - if: inputs.check-format
        name: Restore
        working-directory: ${{ inputs.solution-path }}
        run: dotnet restore ${{ inputs.solution-file }} ${{ inputs.locked-mode && '--locked-mode' || '' }}
      - if: inputs.check-format
        working-directory: ${{ inputs.solution-path }}
        run: dotnet format ${{ inputs.solution-file }} whitespace --no-restore --verify-no-changes
