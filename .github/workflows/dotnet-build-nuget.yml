name: .NET NuGet Build

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version to publish (e.g. 0.2.0)
        type: string
        required: true
      solution-path:
        description: Path to the solution directory
        type: string
        default: 'src'
      solution-file:
        description: Solution file name (sln/slnx)
        type: string
        required: true
      locked-mode:
        description: Use --locked-mode for restore (requires packages.lock.json)
        type: boolean
        default: true
    outputs:
      artifact-name:
        description: Name of the uploaded artifact containing .nupkg files
        value: nuget-packages

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj

      - name: Restore
        working-directory: ${{ inputs.solution-path }}
        run: dotnet restore ${{ inputs.solution-file }} ${{ inputs.locked-mode && '--locked-mode' || '' }}
      - name: Build
        working-directory: ${{ inputs.solution-path }}
        run: dotnet build ${{ inputs.solution-file }} --no-restore --configuration Release /p:Version=${{ inputs.version }} /p:ContinuousIntegrationBuild=true
      - name: Test
        working-directory: ${{ inputs.solution-path }}
        run: >-
          dotnet test --solution ${{ inputs.solution-file }} --no-build --no-ansi --configuration Release
          --coverage --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/testresults
      - uses: danielpalme/ReportGenerator-GitHub-Action@5
        if: always()
        with:
          reports: '${{ github.workspace }}/testresults/**/*.cobertura.xml'
          targetdir: ./coveragereport
          reporttypes: MarkdownSummaryGithub
      - if: always()
        run: cat ./coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Pack
        working-directory: ${{ inputs.solution-path }}
        run: >-
          dotnet pack ${{ inputs.solution-file }} --no-build --configuration Release
          --output ${{ github.workspace }}/packages
          /p:PackageVersion=${{ inputs.version }}
          /p:PackageReleaseNotes="https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/packages/*.nupkg
