name: .NET NuGet Release

on:
  workflow_call:
    inputs:
      solution-path:
        description: Path to the solution directory
        type: string
        default: 'src'
      solution-file:
        description: Solution file name (sln/slnx)
        type: string
        required: true
      package-name:
        description: NuGet package name (for release notes URL)
        type: string
        required: true
    secrets:
      NUGET_API_KEY:
        required: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore

      - name: Slopwatch
        run: dotnet tool run slopwatch analyze --fail-on warning

      - name: Restore
        run: dotnet restore --locked-mode ${{ inputs.solution-path }}/${{ inputs.solution-file }}

      - name: Build
        run: >-
          dotnet build --configuration Release --no-restore
          ${{ inputs.solution-path }}/${{ inputs.solution-file }}
          /p:Version=${{ needs.release-please.outputs.version }}
          /p:ContinuousIntegrationBuild=true

      - name: Test
        working-directory: ${{ inputs.solution-path }}
        run: >-
          dotnet test --configuration Release --no-ansi --no-build
          --coverage --coverage-output-format cobertura
          --coverage-output ${{ github.workspace }}/testresults/coverage.cobertura.xml
          --results-directory ${{ github.workspace }}/testresults
          --solution *.*

      - name: Pack
        run: >-
          dotnet pack --configuration Release --no-build
          --output ./packages
          ${{ inputs.solution-path }}/${{ inputs.solution-file }}
          /p:PackageVersion=${{ needs.release-please.outputs.version }}
          /p:PackageReleaseNotes="https://github.com/${{ github.repository }}/releases/tag/v${{ needs.release-please.outputs.version }}"

      - uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: '${{ github.workspace }}/testresults/**/coverage.cobertura.xml'
          targetdir: ./coveragereport
          reporttypes: MarkdownSummaryGithub
          tag: ${{ needs.release-please.outputs.version }}
      - if: always()
        run: cat ./coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./packages/*.nupkg

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: nuget
      url: https://www.nuget.org/packages/${{ inputs.package-name }}
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./packages
      - name: Push to NuGet
        run: >-
          dotnet nuget push --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate ./packages/*.nupkg
      - name: Attach .nupkg to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: gh release upload "v${VERSION}" ./packages/*.nupkg --clobber
