name: Security

on:
  workflow_call:
    inputs:
      scan-type:
        description: "Scan type: 'image' builds a local Docker image and scans it, 'fs' scans the filesystem/dependencies directly."
        type: string
        default: 'image'
      docker-image-name:
        description: Image name for the local Docker build (only used when scan-type is image)
        type: string
        default: 'app'
      skip-dirs:
        description: >-
          Comma-separated list of directories to exclude from scanning
          (e.g. 'docs,test/fixtures'). Passed to Trivy's --skip-dirs flag.
        type: string
        default: ''

jobs:
  trivy-image:
    if: inputs.scan-type == 'image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ inputs.docker-image-name }}:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.docker-image-name }}:scan
          skip-dirs: ${{ inputs.skip-dirs }}
          scanners: vuln,secret
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  trivy-fs:
    if: inputs.scan-type == 'fs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: ${{ inputs.skip-dirs }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
