name: Security

on:
  workflow_call:
    inputs:
      scan-type:
        description: "Scan type: 'image' for Docker image scan, 'fs' for filesystem/dependency scan"
        type: string
        default: 'image'
      docker-image-name:
        description: Image name for the Trivy scan (only used when scan-type is image)
        type: string
        default: 'app'
      trivy-config:
        description: >-
          Path to a trivy.yaml in the consumer repo for scan tuning (skip-files,
          skip-dirs, etc.). severity/scanners/ignore-unfixed stay hardcoded below
          and always win over trivy.yaml (Trivy/Viper precedence) — only keys
          this workflow doesn't already set explicitly take effect from the
          config file.
        type: string
        default: ''

jobs:
  trivy-image:
    if: inputs.scan-type == 'image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ inputs.docker-image-name }}:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.docker-image-name }}:scan
          trivy-config: ${{ inputs.trivy-config }}
          scanners: vuln,secret
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  trivy-fs:
    if: inputs.scan-type == 'fs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: ${{ inputs.trivy-config }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
