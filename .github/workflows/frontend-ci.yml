name: Frontend CI

on:
  workflow_call:
    inputs:
      project-path:
        description: Path to the pnpm project directory
        type: string
        required: true
      node-version:
        description: Node.js version
        type: string
        default: '24'
      lint:
        description: Run pnpm lint
        type: boolean
        default: true
      typecheck:
        description: Run pnpm typecheck
        type: boolean
        default: true
      test:
        description: Run pnpm test
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: ${{ inputs.project-path }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.project-path }}/pnpm-lock.yaml
      - name: Install
        working-directory: ${{ inputs.project-path }}
        run: pnpm install --frozen-lockfile
      - if: inputs.lint
        name: Lint
        working-directory: ${{ inputs.project-path }}
        run: pnpm lint
      - if: inputs.typecheck
        name: Typecheck
        working-directory: ${{ inputs.project-path }}
        run: pnpm typecheck
      - if: inputs.test
        name: Test
        working-directory: ${{ inputs.project-path }}
        run: pnpm test
