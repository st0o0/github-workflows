name: Go Dev Build

on:
  workflow_call:
    inputs:
      image-name:
        description: Full GHCR image name (e.g. ghcr.io/st0o0/bifrost)
        type: string
        required: true
      image-description:
        description: OCI image description for dev builds
        type: string
        default: ''

jobs:
  publish:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'dev-build') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: vars
        run: echo "shortsha=$(cut -c1-7 <<< '${{ github.event.pull_request.head.sha }}')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}-${{ steps.vars.outputs.shortsha }}
          tags: |
            ${{ inputs.image-name }}:pr-${{ github.event.pull_request.number }}
            ${{ inputs.image-name }}:dev-${{ steps.vars.outputs.shortsha }}
          annotations: |
            index:org.opencontainers.image.description=${{ inputs.image-description }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Comment pull command on PR
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = '${{ steps.vars.outputs.shortsha }}';
            const image = '${{ inputs.image-name }}';
            const marker = '<!-- dev-build-comment -->';
            const body = [
              marker,
              `Dev build published (\`dev-${sha}\`):`,
              '',
              '```bash',
              `docker pull ${image}:pr-${pr}`,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr, per_page: 100 });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
