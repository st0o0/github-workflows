name: Docker Dev Build

on:
  workflow_call:
    inputs:
      image-name:
        description: Full GHCR image name (e.g. ghcr.io/st0o0/app)
        type: string
        required: true
      image-description:
        description: OCI image description for dev builds
        type: string
        default: ''
      platform:
        description: Target platform for dev build
        type: string
        default: 'linux/amd64'
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: 'Dockerfile'

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "shortsha=$(cut -c1-7 <<< '${{ github.event.pull_request.head.sha }}')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.dockerfile }}
          context: .
          platforms: ${{ inputs.platform }}
          push: true
          tags: |
            ${{ inputs.image-name }}:pr-${{ github.event.pull_request.number }}
            ${{ inputs.image-name }}:dev-${{ steps.vars.outputs.shortsha }}
          labels: |
            org.opencontainers.image.version=0.0.0-dev.${{ steps.vars.outputs.shortsha }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
          annotations: |
            index:org.opencontainers.image.description=${{ inputs.image-description }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.version=0.0.0-dev.${{ steps.vars.outputs.shortsha }}
          build-args: VERSION=0.0.0-dev.${{ steps.vars.outputs.shortsha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - name: Get manifest digest
        id: manifest
        run: |
          TAG="pr-${{ github.event.pull_request.number }}"
          DIGEST=$(docker buildx imagetools inspect "${{ inputs.image-name }}:${TAG}" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the dev image (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${{ inputs.image-name }}@${DIGEST}"

      - name: Comment pull command on PR
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = '${{ steps.vars.outputs.shortsha }}';
            const image = '${{ inputs.image-name }}';
            const marker = '<!-- dev-build-comment -->';
            const body = [
              marker,
              `Dev build published (\`dev-${sha}\`):`,
              '',
              '```bash',
              `docker pull ${image}:pr-${pr}`,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr, per_page: 100 });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
