name: .NET Dev Build

on:
  workflow_call:
    inputs:
      image-name:
        description: Full GHCR image name (e.g. ghcr.io/st0o0/njord)
        type: string
        required: true
      image-description:
        description: OCI image description for dev builds
        type: string
        default: ''
      solution-path:
        description: Path to the solution directory
        type: string
        default: 'src'
      publish-project:
        description: Project path for dotnet publish (relative to solution-path)
        type: string
        required: true

jobs:
  gate:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'dev-build') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "Dev build approved"

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - rid: linux-x64
            platform: linux/amd64
          - rid: linux-arm64
            platform: linux/arm64
          - rid: linux-arm
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - id: vars
        run: echo "shortsha=$(cut -c1-7 <<< '${{ github.event.pull_request.head.sha }}')" >> "$GITHUB_OUTPUT"
      - name: Publish
        working-directory: ${{ inputs.solution-path }}
        run: >-
          dotnet publish ${{ inputs.publish-project }}
          -c Release -r ${{ matrix.rid }} --self-contained false
          -o ../publish/${{ matrix.rid }}
          -p:Version=0.0.0-pr.${{ github.event.pull_request.number }}.${{ steps.vars.outputs.shortsha }}
      - uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 1

  docker:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: publish
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        run: echo "shortsha=$(cut -c1-7 <<< '${{ github.event.pull_request.head.sha }}')" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64
        uses: docker/build-push-action@v7
        id: build-amd64
        with:
          file: Dockerfile
          context: publish/publish-linux-x64
          platforms: linux/amd64
          cache-from: type=gha,scope=dev-amd64
          cache-to: type=gha,scope=dev-amd64,mode=max
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push arm64
        uses: docker/build-push-action@v7
        id: build-arm64
        with:
          file: Dockerfile
          context: publish/publish-linux-arm64
          platforms: linux/arm64
          cache-from: type=gha,scope=dev-arm64
          cache-to: type=gha,scope=dev-arm64,mode=max
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push armv7
        uses: docker/build-push-action@v7
        id: build-armv7
        with:
          file: Dockerfile
          context: publish/publish-linux-arm
          platforms: linux/arm/v7
          cache-from: type=gha,scope=dev-armv7
          cache-to: type=gha,scope=dev-armv7,mode=max
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Create multi-arch manifest
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.vars.outputs.shortsha }}
          AMD64: ${{ steps.build-amd64.outputs.digest }}
          ARM64: ${{ steps.build-arm64.outputs.digest }}
          ARMV7: ${{ steps.build-armv7.outputs.digest }}
          IMAGE: ${{ inputs.image-name }}
          DESC: ${{ inputs.image-description }}
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DESC}" \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "${IMAGE}:pr-${PR}" \
            -t "${IMAGE}:dev-${SHA}" \
            "${IMAGE}@${AMD64}" \
            "${IMAGE}@${ARM64}" \
            "${IMAGE}@${ARMV7}"

      - name: Comment pull command on PR
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = '${{ steps.vars.outputs.shortsha }}';
            const image = '${{ inputs.image-name }}';
            const marker = '<!-- dev-build-comment -->';
            const body = [
              marker,
              `Dev build published (\`dev-${sha}\`) -- multi-arch (amd64, arm64, armv7):`,
              '',
              '```bash',
              `docker pull ${image}:pr-${pr}`,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr, per_page: 100 });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
