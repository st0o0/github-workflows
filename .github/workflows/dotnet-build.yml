name: .NET Build

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version (e.g. 0.2.0)
        type: string
        required: true
      solution-path:
        description: Path to the solution directory
        type: string
        default: 'src'
      solution-file:
        description: Solution file name for restore and test
        type: string
        required: true
      publish-project:
        description: Project path for dotnet publish (relative to solution-path)
        type: string
        required: true
      rids:
        description: 'JSON array of RIDs to build (e.g. ["linux-x64","linux-arm64","linux-arm"])'
        type: string
        default: '["linux-x64","linux-arm64","linux-arm"]'
      test:
        description: Run dotnet test before publish (runs on linux-x64 only)
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        rid: ${{ fromJSON(inputs.rids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.solution-path }}/global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles(format('{0}/**/*.csproj', inputs.solution-path), format('{0}/Directory.Packages.props', inputs.solution-path)) }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        working-directory: ${{ inputs.solution-path }}
        run: dotnet restore ${{ inputs.solution-file }} -r ${{ matrix.rid }}
      - if: inputs.test && matrix.rid == 'linux-x64'
        name: Test
        working-directory: ${{ inputs.solution-path }}
        run: dotnet test --solution ${{ inputs.solution-file }} --no-restore
      - name: Publish
        working-directory: ${{ inputs.solution-path }}
        run: >-
          dotnet publish ${{ inputs.publish-project }}
          -c Release -r ${{ matrix.rid }} --self-contained false --no-restore
          -o ../publish/${{ matrix.rid }}
          -p:Version=${{ inputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 1
